  <!-- No-flash theme bootstrap (runs before React mounts).
       Honors saved choice first, then OS preference as a fallback. -->
  <script>
    (function() {
      try {
        var t = localStorage.getItem('aestra-theme');
        var light = t === 'light';
        if (!t) {
          light = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
        }
        if (light) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch (e) {}
    })();
  </script>
