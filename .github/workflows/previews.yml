name: previews
on:
  pull_request:
    paths: ["src/components/previews/**", "src/content/changelog/**", "scripts/*previews*", "package*.json"]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run check:previews
      - run: npm run audit:previews
