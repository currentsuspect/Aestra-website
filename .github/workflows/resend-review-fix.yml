name: Apply Resend review fixes

on:
  push:
    branches:
      - agent/resend-waitlist
    paths:
      - .github/workflows/resend-review-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/resend-waitlist
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply review fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected text not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          # Homepage Founder form: migrate the last Formspree path and add a honeypot.
          replace_once(
              "src/pages/Home.tsx",
              'const FORMSPREE_ID = import.meta.env.VITE_FORMSPREE_ID;\n\n',
              '',
          )
          replace_once(
              "src/pages/Home.tsx",
              '  const [email, setEmail] = useState("");\n  const [submitting, setSubmitting] = useState(false);',
              '  const [email, setEmail] = useState("");\n  const [website, setWebsite] = useState("");\n  const [submitting, setSubmitting] = useState(false);',
          )
          replace_once(
              "src/pages/Home.tsx",
              '''      const res = await fetch(`https://formspree.io/f/${FORMSPREE_ID}`, {\n        method: "POST",\n        headers: { "Content-Type": "application/json" },\n        body: JSON.stringify({ email, source: "founder-waitlist" }),\n      });''',
              '''      const res = await fetch("/api/waitlist", {\n        method: "POST",\n        headers: { "Content-Type": "application/json" },\n        body: JSON.stringify({ email, website, source: "founder-waitlist" }),\n      });''',
          )
          replace_once(
              "src/pages/Home.tsx",
              '                    <label htmlFor={formId} className="sr-only">Email address</label>\n',
              '''                    <label className="sr-only" aria-hidden="true">\n                      Website\n                      <input\n                        type="text"\n                        name="website"\n                        value={website}\n                        onChange={(e) => setWebsite(e.target.value)}\n                        tabIndex={-1}\n                        autoComplete="off"\n                      />\n                    </label>\n                    <label htmlFor={formId} className="sr-only">Email address</label>\n''',
          )

          # Modal: same honeypot field, same API path.
          replace_once(
              "src/components/EarlyAccessModal.tsx",
              '  const [daw, setDaw] = useState("");\n  const [submitting, setSubmitting] = useState(false);',
              '  const [daw, setDaw] = useState("");\n  const [website, setWebsite] = useState("");\n  const [submitting, setSubmitting] = useState(false);',
          )
          replace_once(
              "src/components/EarlyAccessModal.tsx",
              '                    body: JSON.stringify({ name, email, daw, source: copy.source }),',
              '                    body: JSON.stringify({ name, email, daw, website, source: copy.source }),',
          )
          replace_once(
              "src/components/EarlyAccessModal.tsx",
              '              <div>\n                <label htmlFor="ea-name"',
              '''              <label className="sr-only" aria-hidden="true">\n                Website\n                <input\n                  type="text"\n                  name="website"\n                  value={website}\n                  onChange={(e) => setWebsite(e.target.value)}\n                  tabIndex={-1}\n                  autoComplete="off"\n                />\n              </label>\n              <div>\n                <label htmlFor="ea-name"''',
          )

          # BotID client initialization for the protected route.
          replace_once(
              "src/main.tsx",
              'import { App } from "./App";\n',
              'import { App } from "./App";\nimport { initBotId } from "botid/client/core";\n',
          )
          replace_once(
              "src/main.tsx",
              '// WebMCP: expose site tools to AI agents via the browser\n',
              '''if (import.meta.env.PROD) {\n  initBotId({\n    protect: [{ path: "/api/waitlist", method: "POST" }],\n  });\n}\n\n// WebMCP: expose site tools to AI agents via the browser\n''',
          )

          # Remove dead Formspree network hints and CSP permissions.
          p = Path("index.html")
          text = p.read_text()
          text = text.replace('  <link rel="dns-prefetch" href="https://formspree.io">\n', '')
          text = text.replace('  <link rel="preconnect" href="https://formspree.io" crossorigin>\n', '')
          old_csp = "default-src 'self'; script-src 'self' 'unsafe-inline' https://formspree.io; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://formspree.io https://api.github.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://formspree.io; object-src 'none';"
          new_csp = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://api.github.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none';"
          if old_csp not in text:
              raise SystemExit("expected Formspree CSP not found")
          p.write_text(text.replace(old_csp, new_csp, 1))

          # Typecheck the server function during the normal build.
          p = Path("package.json")
          package = json.loads(p.read_text())
          package["scripts"]["build"] = "node scripts/agent-skills.mjs && tsc --noEmit && vite build"
          p.write_text(json.dumps(package, indent=2) + "\n")

          # BotID proxy rewrites for framework-agnostic Vite deployments.
          p = Path("vercel.json")
          config = json.loads(p.read_text())
          bot_prefix = "/149e9513-01fa-4fb0-aad4-566afd725d1b/2d206a39-8ed7-437e-a3be-862e0f06eea3"
          bot_rewrites = [
              {
                  "source": f"{bot_prefix}/a-4-a/c.js",
                  "destination": "https://api.vercel.com/bot-protection/v1/challenge",
              },
              {
                  "source": f"{bot_prefix}/:path*",
                  "destination": "https://api.vercel.com/bot-protection/v1/proxy/:path*",
              },
          ]
          config["rewrites"] = bot_rewrites + [r for r in config.get("rewrites", []) if not r.get("source", "").startswith(bot_prefix)]
          bot_header = {
              "source": f"{bot_prefix}/:path*",
              "headers": [{"key": "X-Frame-Options", "value": "SAMEORIGIN"}],
          }
          config["headers"] = [bot_header] + [h for h in config.get("headers", []) if h.get("source") != bot_header["source"]]
          p.write_text(json.dumps(config, indent=2) + "\n")

          # Replace the function wholesale so the review fixes stay coherent.
          Path("api/waitlist.ts").write_text(r'''import { waitUntil } from "@vercel/functions";
          import { checkBotId } from "botid/server";

          type WaitlistPurpose = "early-access" | "supporter-notify" | "founder-waitlist";

          type WaitlistPayload = {
            name?: unknown;
            email?: unknown;
            daw?: unknown;
            source?: unknown;
            website?: unknown;
          };

          const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
          const PURPOSES = new Set<WaitlistPurpose>([
            "early-access",
            "supporter-notify",
            "founder-waitlist",
          ]);

          function text(value: unknown, maxLength: number, singleLine = false): string {
            if (typeof value !== "string") return "";
            const normalized = singleLine ? value.replace(/[\r\n]+/g, " ") : value;
            return normalized.trim().slice(0, maxLength);
          }

          function isWaitlistPurpose(value: string): value is WaitlistPurpose {
            return PURPOSES.has(value as WaitlistPurpose);
          }

          function json(body: unknown, status = 200, headers: HeadersInit = {}) {
            return Response.json(body, {
              status,
              headers: {
                "Cache-Control": "no-store",
                ...Object.fromEntries(new Headers(headers)),
              },
            });
          }

          async function resendFetch(apiKey: string, path: string, init: RequestInit = {}) {
            const response = await fetch(`https://api.resend.com${path}`, {
              ...init,
              headers: {
                Authorization: `Bearer ${apiKey}`,
                "Content-Type": "application/json",
                ...Object.fromEntries(new Headers(init.headers)),
              },
            });
            return response;
          }

          async function ensureContact(apiKey: string, email: string, name: string) {
            const contactPath = `/contacts/${encodeURIComponent(email)}`;
            const existing = await resendFetch(apiKey, contactPath);
            if (existing.ok) return;
            if (existing.status !== 404) {
              const detail = await existing.text().catch(() => "");
              throw new Error(`Resend contact lookup failed (${existing.status}): ${detail.slice(0, 500)}`);
            }

            const created = await resendFetch(apiKey, "/contacts", {
              method: "POST",
              body: JSON.stringify({
                email,
                ...(name ? { first_name: name } : {}),
                unsubscribed: false,
              }),
            });
            if (created.ok) return;

            // A concurrent duplicate submission can win the create race.
            const raced = await resendFetch(apiKey, contactPath);
            if (raced.ok) return;

            const detail = await created.text().catch(() => "");
            throw new Error(`Resend contact create failed (${created.status}): ${detail.slice(0, 500)}`);
          }

          async function idempotencyKey(source: WaitlistPurpose, email: string) {
            const bytes = new TextEncoder().encode(`${source}:${email}`);
            const digest = await crypto.subtle.digest("SHA-256", bytes);
            const hex = Array.from(new Uint8Array(digest), (b) => b.toString(16).padStart(2, "0")).join("");
            return `waitlist-notify/${source}/${hex}`;
          }

          async function sendNotification(
            apiKey: string,
            payload: Record<string, unknown>,
            key: string,
          ) {
            const response = await resendFetch(apiKey, "/emails", {
              method: "POST",
              headers: { "Idempotency-Key": key },
              body: JSON.stringify(payload),
            });

            if (!response.ok) {
              const detail = await response.text().catch(() => "");
              throw new Error(`Resend rejected email (${response.status}): ${detail.slice(0, 500)}`);
            }
          }

          export default {
            async fetch(request: Request) {
              if (request.method !== "POST") {
                return json({ error: "Method not allowed" }, 405, { Allow: "POST" });
              }

              const verification = await checkBotId();
              if (verification.isBot) {
                return json({ error: "Access denied" }, 403);
              }

              const origin = request.headers.get("Origin");
              if (!origin || origin !== new URL(request.url).origin) {
                return json({ error: "Access denied" }, 403);
              }

              const apiKey = process.env.RESEND_API_KEY;
              if (!apiKey) {
                console.error("RESEND_API_KEY is not configured");
                return json({ error: "Email service unavailable" }, 503);
              }

              let body: WaitlistPayload;
              try {
                body = await request.json() as WaitlistPayload;
              } catch {
                return json({ error: "Invalid JSON body" }, 400);
              }

              // Honeypot: real forms hide this field from users.
              if (text(body.website, 200)) {
                return json({ ok: true });
              }

              const name = text(body.name, 100, true);
              const email = text(body.email, 254, true).toLowerCase();
              const daw = text(body.daw, 120, true);
              const source = text(body.source, 40, true);

              if (!EMAIL_RE.test(email) || !isWaitlistPurpose(source)) {
                return json({ error: "Invalid waitlist submission" }, 400);
              }
              if (source !== "founder-waitlist" && !name) {
                return json({ error: "Name is required" }, 400);
              }

              const notifyTo = process.env.WAITLIST_NOTIFY_TO || "hello@aestra.studio";
              const from = process.env.RESEND_FROM || "Aestra <hello@aestra.studio>";
              const label = source === "supporter-notify"
                ? "Supporter notification"
                : source === "founder-waitlist"
                  ? "Founder waitlist"
                  : "Early access";

              try {
                // This is the durable record. Email is only an operational alert.
                await ensureContact(apiKey, email, name);
              } catch (error) {
                console.error("Waitlist contact persistence failed", error);
                return json({ error: "Could not save waitlist request" }, 502);
              }

              const notification = (async () => {
                const key = await idempotencyKey(source, email);
                await sendNotification(apiKey, {
                  from,
                  to: [notifyTo],
                  reply_to: email,
                  subject: `[Aestra] ${label}: ${name || email}`,
                  text: [
                    `${label} signup`,
                    "",
                    `Name: ${name || "Not provided"}`,
                    `Email: ${email}`,
                    `Current DAW: ${daw || "Not provided"}`,
                    `Source: ${source}`,
                  ].join("\n"),
                }, key);
              })().catch((error) => {
                console.error("Waitlist notification email failed", error);
              });

              waitUntil(notification);
              return json({ ok: true });
            },
          };
          '''.replace("          ", ""))

          # Documentation: storage is now Resend Contacts; caller confirmations are intentionally absent.
          p = Path("README.md")
          text = p.read_text()
          marker = "`WAITLIST_NOTIFY_TO` and `RESEND_FROM` are optional; both default to `hello@aestra.studio`.\n"
          if marker in text:
              text = text.replace(
                  marker,
                  marker + "\nWaitlist submissions are persisted as Resend Contacts before the API returns success. The endpoint is protected with Vercel BotID; keep a Vercel Firewall rate limit on `POST /api/waitlist` as an additional quota guard. The Resend key therefore needs contact access as well as send access.\n",
                  1,
              )
          p.write_text(text)

          # Normalize touched text files with a trailing newline.
          for path in [
              "src/pages/Home.tsx",
              "src/components/EarlyAccessModal.tsx",
              "src/main.tsx",
              "index.html",
              "api/waitlist.ts",
              "README.md",
              "vercel.json",
              "package.json",
          ]:
              p = Path(path)
              p.write_text(p.read_text().rstrip("\n") + "\n")
          PY

      - name: Install runtime dependencies
        run: npm install --save botid@1.5.11 @vercel/functions@3.7.6

      - name: Validate
        run: |
          npm run build
          git diff --check

      - name: Commit fixes and remove one-shot workflow
        shell: bash
        run: |
          git rm .github/workflows/resend-review-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden Resend waitlist migration"
          git push origin HEAD:agent/resend-waitlist
